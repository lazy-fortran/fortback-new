name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GIT_TERMINAL_PROMPT: 0
    steps:
      - uses: actions/checkout@v4

      - name: Install Fortran compiler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gfortran

      - name: Install fpm
        run: |
          curl -sSLo /usr/local/bin/fpm \
            https://github.com/fortran-lang/fpm/releases/download/v0.13.0/fpm-0.13.0-linux-x86_64-gcc-12
          chmod +x /usr/local/bin/fpm

      - name: Text policy gate self-test
        run: scripts/check_text_policy.sh --self-test

      - name: Text policy gate
        run: scripts/check_text_policy.sh

      - name: Build and test
        run: |
          fpm build --flag "-Wall -Wextra -fcheck=all"
          fpm test --flag "-Wall -Wextra -fcheck=all"
